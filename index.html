*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:19px;line-height:1.57;-webkit-text-size-adjust:100%}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #edb72a;outline-offset:3px}#app{max-width:840px;margin:0 auto;padding:12px 12px 102px}.mast{background:linear-gradient(125deg,#081d37,#153c68 77%,#205080);color:#fff;padding:18px 18px 20px;border-radius:18px 18px 7px 7px;border-bottom:5px solid var(--gold);box-shadow:0 10px 25px #081d371c}.brand{font-weight:900;letter-spacing:.035em;line-height:1.2;font-size:clamp(16px,4.6vw,21px)}.brand strong{color:#ffcf73;display:block;font-size:1.06em}.mastline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.pill{background:#ffffff1b;border:1px solid #ffffff40;border-radius:40px;padding:6px 14px;font-weight:800;font-size:.87em}.whitecard{background:white;padding:18px;border-radius:7px 7px 16px 16px;border:1px solid var(--line);box-shadow:0 8px 22px #1128410b}.cover{padding:27px 20px 35px;text-align:center}.cover h1{font-size:clamp(32px,8vw,55px);color:var(--navy);line-height:1.1;margin:14px 0 18px;letter-spacing:-.025em}.eyebrow{font-size:.83em;letter-spacing:.13em;color:#385a7b;text-transform:uppercase;font-weight:900}.lede{font-size:1.12em;color:#3b536a;max-width:600px;margin:10px auto 27px}.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:550px;margin:26px auto}.hl{border:1px solid #d9e4ed;border-radius:13px;padding:12px 7px;background:#f8fbff}.hl b{display:block;font-size:1.7em;color:var(--navy)}.hl span{font-size:.72em;color:var(--muted);font-weight:700}.primary,.outline,.subtle,.danger{border-radius:14px;min-height:54px;padding:12px 18px;font-size:1.03em;font-weight:800}.primary{background:var(--navy);color:#fff;border:2px solid var(--navy);box-shadow:0 5px 13px #10325533}.outline{background:#fff;color:var(--navy);border:2px solid #9bb1c8}.subtle{background:#eef3f8;color:var(--navy);border:2px solid #d1deeb}.danger{background:#fff;color:#ad2f36;border:2px solid #e7b6b6}.primary:disabled,.outline:disabled,.subtle:disabled{opacity:.43;cursor:not-allowed}.big-btn{width:100%;max-width:540px}.minibtn{border:0;background:transparent;color:#365470;padding:7px;text-decoration:underline;font-size:.84em;font-weight:650}.questiontop{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:.84em;font-weight:800;margin:12px 0 6px}.bar{height:12px;background:#d6e2ec;border-radius:14px;overflow:hidden;margin-bottom:17px}.bar>div{height:100%;background:linear-gradient(90deg,#f3bc48,#f7db8c);border-radius:inherit;transition:width .25s}.topic{display:inline-block;border-radius:20px;background:#e7eef7;color:#214a76;font-weight:800;font-size:.85em;padding:5px 12px;margin:3px 0 11px}.qtitle{font-size:clamp(22px,5.8vw,29px);line-height:1.42;margin:4px 0 18px;font-weight:750;white-space:pre-wrap}.answers{display:grid;gap:11px}.opt{display:flex;align-items:flex-start;gap:13px;border:2px solid #d9e4ec;padding:14px 13px;background:white;border-radius:14px;width:100%;text-align:left;line-height:1.46;font-size:1.04em;color:var(--ink)}.opt:not([disabled]):hover{border-color:#6a97c0;background:#f7faff}.opt.selected{border-color:var(--blue);background:#ecf4ff}.opt .letter{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:inline-grid;place-items:center;background:#e5edf6;color:#163960;font-weight:900}.opt.right{background:#e3f7e9;border-color:#238b5f}.opt.right .letter{background:#187b52;color:white}.opt.wrong{background:#ffe8e8;border-color:#ce4b51}.opt.wrong .letter{background:#bb3e45;color:white}.opt[disabled]{cursor:default;opacity:1}.tools{display:flex;gap:11px;align-items:center;margin-top:18px;flex-wrap:wrap}.tools .primary{flex:1}.tip{font-size:.82em;color:var(--muted);margin-top:10px}.feedback{margin-top:23px;border-radius:15px;overflow:hidden;border:1px solid #b8d9c7;background:#f6fff9;scroll-margin-top:12px}.feedback.fail{background:#fffaf9;border-color:#ecc3c5}.feedback .fhead{padding:13px 16px;background:#d7f2df;display:flex;align-items:center;gap:11px;font-weight:900;color:#116540;font-size:1.06em}.feedback.fail .fhead{background:#ffe6e6;color:#a83136}.status-icon{font-size:1.3em}.fbcontent{padding:15px 17px 19px}.fbcontent h3{font-size:1em;color:var(--navy);margin:13px 0 4px}.fbcontent p{margin:0 0 13px;white-space:pre-line}.gabarito{border-left:5px solid var(--gold);padding:10px 13px;margin:10px 0 17px;background:#fff8e8;border-radius:3px 10px 10px 3px;font-weight:850}.sourcehint{border:1px solid #e4d4ad;background:#fffaf0;border-radius:9px;margin-top:12px;padding:10px 13px;font-size:.87em;color:#705421}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));background:#fbfcffed;backdrop-filter:blur(14px);border-top:1px solid #ccd8e4;box-shadow:0 -5px 25px #0924431a}.navin{max-width:830px;margin:auto;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.nav .primary,.nav .outline,.nav .subtle{min-height:52px;font-size:.95em;padding:9px 8px}.nav .subtle{padding:9px 13px}.flash{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .15s;background:radial-gradient(circle at 50% 45%,#23e58574,#009b4a23 60%,#08854318);box-shadow:inset 0 0 0 14px #21bd5b88}.flash.error{background:radial-gradient(circle at 50% 45%,#fb32328a,#d92c2c24 60%,#b92a2a1c);box-shadow:inset 0 0 0 14px #d7323299}.flash.show{opacity:1}.flash .flashmsg{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#087449;color:#fff;box-shadow:0 5px 20px #10101033;border-radius:40px;padding:11px 25px;font-size:1.25em;font-weight:950;text-align:center;white-space:nowrap}.flash.error .flashmsg{background:#b92932}.results h2{font-size:2em;text-align:center;margin:14px 0}.score{font-size:clamp(55px,13vw,87px);color:var(--navy);text-align:center;line-height:1.2;font-weight:900}.scoresub{text-align:center;color:#53708c;margin:2px 0 22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.metric{background:#f4f8fc;border-radius:13px;text-align:center;padding:14px 8px}.metric strong{font-size:1.4em;display:block}.metric span{font-size:.75em;color:var(--muted);font-weight:750}.review{display:grid;gap:8px;margin-top:18px}.review button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;padding:12px;border-radius:11px;color:var(--ink);text-align:left}.rmark{font-weight:900}.rmark.ok{color:#0d8757}.rmark.bad{color:#b63a3b}.rmark.skip{color:#667d90}.small{font-size:.85em;color:var(--muted)}.lightlabel{color:#ffd686;font-weight:900}.result-actions{display:grid;gap:10px;margin:18px 0 8px}

<script>
'use strict';
const QUIZ_NUM=1, DATA=[{"original":1,"topic":"CONCEITOS BÁSICOS DA CONTABILIDADE","prompt":"De acordo com a equação fundamental do patrimônio, um aumento em uma conta do ativo pode ter como contrapartida uma diminuição","options":["no ativo, apenas.","no patrimônio líquido, apenas.","no ativo e no passivo.","no ativo e no patrimônio líquido.","no passivo e no patrimônio líquido."],"answer":"A","why":"O aumento de um ativo pode ser compensado pela redução de outro ativo, como na compra de mercadorias à vista: débito em Estoques e crédito em Caixa. O total do ativo não precisa mudar.","others":"B e D incluem redução do patrimônio líquido, que não é a contrapartida necessária para aumento de um ativo; C e E incluem redução de passivo, que em regra também exigiria outra contrapartida. O enunciado pede a possibilidade expressa entre as opções, não todas as formas possíveis de aumentar o ativo."},{"original":6,"topic":"FATOS CONTÁBEIS","prompt":"Na lógica patrimonial, a aquisição de material de expediente para estoque, com pagamento à vista, é considerada como um fato contábil:","options":["modificativo aumentativo;","modificativo diminutivo;","misto;","misto aumentativo;","permutativo."],"answer":"E","why":"Ao comprar material para estoque pagando à vista, a entidade troca Caixa por Estoques, ambos ativos. O patrimônio líquido não se altera: fato permutativo.","others":"Não é modificativo aumentativo nem diminutivo, porque não nasce receita ou despesa; tampouco é misto, pois não há combinação de permuta e alteração do patrimônio líquido."},{"original":11,"topic":"ESCRITURAÇÃO E PARTIDAS DOBRADAS","prompt":"O documento de registro auxiliar, utilizado em contabilidade, no qual os registros contábeis são organizados por conta e, dentro de cada conta, mostrados necessariamente em ordem cronológica, é denominado","options":["escritura.","livro diário.","balanço contábil.","livro-razão.","balanço patrimonial."],"answer":"D","why":"O Livro Razão organiza a escrituração por conta contábil, permitindo acompanhar cronologicamente lançamentos e saldos de cada conta.","others":"O Diário reúne lançamentos em ordem cronológica geral, não agrupados por conta; balanço patrimonial e balanço contábil são relatórios, e escritura não é o livro auxiliar descrito."},{"original":16,"topic":"BALANÇO PATRIMONIAL","prompt":"Em relação ao balanço patrimonial de uma entidade, representa(m) aplicações de recursos:","options":["ativo, apenas.","passivo, apenas.","patrimônio líquido, apenas.","passivo e patrimônio líquido.","ativo e patrimônio líquido."],"answer":"A","why":"Ativos representam aplicações de recursos, isto é, a forma como a empresa emprega os recursos financiados por passivos e patrimônio líquido.","others":"Passivo e patrimônio líquido são fontes ou origens de recursos; as opções que os tratam como aplicações confundem os dois lados da equação patrimonial."},{"original":21,"topic":"ESTRUTURA CONCEITUAL (CPC 00)","prompt":"Os recursos econômicos presentes controlados por uma entidade como resultado de eventos passados são denominados","options":["ativos.","passivos.","receitas.","despesas.","reservas."],"answer":"A","why":"Ativo é recurso econômico presente controlado pela entidade em consequência de eventos passados, com potencial de produzir benefícios econômicos.","others":"Passivo corresponde a obrigação presente; receitas e despesas são elementos ligados ao desempenho; reservas são contas do patrimônio líquido, não definição de recurso controlado."},{"original":26,"topic":"DEMONSTRAÇÃO DO RESULTADO (DRE)","prompt":"Assinale a opção que indica apenas os tributos que incidem sobre as vendas e que são contabilizados como dedução da Receita Bruta na Demonstração do Resultado do Exercício.","options":["PIS e CSLL.","IPI e IR.","ICMS e ISS.","ISS e CSLL.","IR e ICMS."],"answer":"C","why":"ICMS e ISS são tributos incidentes sobre vendas ou serviços normalmente evidenciados como deduções da receita bruta para apuração da receita líquida.","others":"IRPJ e CSLL são tributos sobre o lucro; IPI, na lógica da DRE cobrada, não integra a receita bruta da mesma maneira e não substitui a dupla ICMS/ISS."},{"original":31,"topic":"REGIME DE COMPETÊNCIA E CAIXA","prompt":"Uma entidade usa o Regime de Caixa para contabilizar as suas transações. De acordo com o Regime de Caixa, uma receita deve ser contabilizada de acordo com","options":["a assinatura de contrato.","o acontecimento do fato gerador.","o ingresso de bens e numerários.","a transferência dos riscos e benefícios.","a prestação de serviço ou entrega de produto."],"answer":"C","why":"No regime de caixa, a receita é reconhecida pelo efetivo recebimento de dinheiro ou outros meios de pagamento, não pelo momento de realizar a venda.","others":"Assinatura de contrato, fato gerador, transferência dos riscos e prestação de serviço são referências típicas à competência, sem exigir ingresso de recursos naquele instante."},{"original":36,"topic":"ESTOQUES (CPC 16)","prompt":"Considerando-se os preceitos do CPC 16 – Estoques, em um período de aumento de preços, os métodos de controle de estoque que tendem a resultar em um maior lucro bruto e em um maior estoque final são, respectivamente:","options":["PEPS e PEPS;","PEPS e média ponderada;","PEPS e UEPS;","UEPS e PEPS;","UEPS e média móvel."],"answer":"A","why":"Na inflação, PEPS vende primeiro as unidades antigas, mais baratas, produzindo CMV menor, lucro bruto maior e estoque final com custos recentes mais altos.","others":"UEPS produziria CMV mais elevado e estoque antigo mais baixo; média ponderada tende a ficar entre os extremos, de modo que as demais combinações não maximizam simultaneamente lucro e estoque final."},{"original":41,"topic":"PEPS E CUSTO MÉDIO","prompt":"Uma loja vende uma grande quantidade de eletrodomésticos. O controle é feito apenas por meio de contagem física, realizada por um de seus funcionários, no último dia útil de cada mês. A loja utiliza inventário","options":["periódico.","de varejo.","permanente.","de identificação específica.","primeiro que entra, primeiro que sai."],"answer":"A","why":"Contagem física apenas no último dia de cada mês, sem controle contínuo por item, caracteriza inventário periódico.","others":"Inventário permanente registra movimentações a cada entrada e saída; varejo, identificação específica e PEPS são critérios/técnicas de mensuração e não o sistema de contagem indicado."},{"original":46,"topic":"ATIVO IMOBILIZADO (CPC 27)","prompt":"Dentro do contexto da gestão patrimonial das empresas, os bens corpóreos destinados à manutenção das atividades de uma companhia ou exercidos com essa finalidade são classificados como:","options":["ativo contábil;","ativo imobilizado;","bens intangíveis;","despesa operacional;","despesa permanente."],"answer":"B","why":"Bem corpóreo usado na manutenção das atividades da empresa por mais de um período é classificado como Ativo Imobilizado.","others":"“Ativo contábil” é expressão genérica; intangível não tem substância física; despesas operacionais são consumos do período, não bens duradouros; “despesa permanente” não é classificação patrimonial adequada."},{"original":51,"topic":"DEPRECIAÇÃO E AMORTIZAÇÃO","prompt":"Assinale a opção que indica um ativo imobilizado que, de forma geral, não é depreciado.","options":["Marca.","Edifício.","Terreno.","Máquina.","Direitos autorais."],"answer":"C","why":"Terrenos, em geral, têm vida útil indefinida e não sofrem depreciação. Existem exceções, como terrenos com vida útil limitada em circunstâncias específicas.","others":"Edifícios e máquinas são depreciáveis; marca e direitos autorais são intangíveis, sujeitos às regras de amortização quando há vida útil definida, não classificados como imobilizados depreciáveis."},{"original":56,"topic":"ATIVO INTANGÍVEL (CPC 04)","prompt":"Assinale a opção que indica um bem que deve ser classificado no ativo intangível.","options":["Bibliotecas.","Computadores.","Patentes.","Veículos.","Terrenos."],"answer":"C","why":"Patente é direito sem substância física, identificável e gerador de benefícios econômicos, atendendo às características de intangível quando presentes demais critérios.","others":"Computadores, veículos e terrenos são tangíveis; bibliotecas podem compreender itens materiais, não equivalem a patente intangível nesta questão."},{"original":61,"topic":"IMPAIRMENT (CPC 01)","prompt":"A respeito da realização do teste do valor recuperável, assinale a opção que indica a situação em que não é necessário avaliar o valor justo líquido de despesas de venda de um ativo imobilizado.","options":["O valor em uso do ativo é maior do que o valor contábil.","Não há preço cotado em mercado ativo para ativo idêntico.","A entidade não tem a intenção de vender o ativo.","A entidade estimou nova vida útil para o ativo.","O ativo não é depreciado."],"answer":"A","why":"O valor recuperável é o maior entre valor em uso e valor justo líquido de despesas de alienação. Se o valor em uso sozinho já excede o valor contábil, não haverá perda: não é necessário calcular o outro valor.","others":"Ausência de mercado ativo, falta de intenção de venda, revisão de vida útil ou ausência de depreciação não comprovam por si sós recuperabilidade superior ao valor contábil."},{"original":66,"topic":"CLIENTES E PECLD","prompt":"Em janeiro de 2024, uma sociedade empresária estimou que as suas perdas com crédito de liquidação duvidosa no período seriam de R$200.000. Assinale a opção que indica o impacto do reconhecimento no balanço patrimonial da sociedade empresária neste mês.","options":["não há impacto.","diminuição no saldo da conta Caixa.","diminuição no saldo da conta Clientes.","diminuição no saldo da conta Estoques.","aumento no saldo da conta Estoques."],"answer":"C","why":"A estimativa de perda é reconhecida por débito em despesa com PECLD e crédito em retificadora de Clientes. Com isso, diminui o valor líquido apresentado para Clientes no ativo.","others":"Não há baixa imediata de Caixa nem alteração de Estoques. O total líquido de Clientes é afetado, embora o saldo bruto da conta Clientes permaneça registrado; essa é a interpretação do gabarito C da fonte."},{"original":71,"topic":"DESPESAS ANTECIPADAS","prompt":"Assinale a opção que indica o reconhecimento de uma despesa antecipada de 30/11/2022","options":["Pagamento do seguro de 2023 de veículo.","Pagamento do aluguel do primeiro semestre de 2022.","Recebimento de dinheiro por receita cujo serviço será prestado em dezembro de 2022.","Pagamento dos salários dos funcionários que trabalharam em novembro de 2022.","Reconhecimento de distribuição de dividendos, que serão pagos em janeiro de 2023."],"answer":"A","why":"O seguro pago em novembro de 2022 para vigorar em 2023 ainda proporcionará benefício futuro e, em 30/11/2022, representa despesa antecipada no ativo.","others":"Aluguel do primeiro semestre já foi consumido; adiantamento recebido de cliente é passivo; salários de novembro são despesa do período; dividendos são destinação de lucros, não despesa antecipada."},{"original":76,"topic":"PROVISÕES E CONTINGÊNCIAS","prompt":"As contas a seguir representam estimativas e são contabilizadas no passivo de uma entidade, com exceção de uma. Assinale-a.","options":["Provisão para contingência.","Provisão para custos de desmontagem.","Provisão para créditos de liquidação duvidosa.","Provisão para custos de reestruturação.","Provisão para os custos de descontinuidade."],"answer":"C","why":"PECLD reduz o valor dos recebíveis e é conta retificadora do ativo, não provisão reconhecida no passivo.","others":"Contingências reconhecíveis, desmontagem e certas obrigações de reestruturação/descontinuidade podem gerar provisões no passivo quando cumprem os requisitos do CPC 25."},{"original":81,"topic":"DEMONSTRAÇÃO DOS FLUXOS DE CAIXA","prompt":"As despesas com depreciação e com provisões são apresentadas na Demonstração dos Fluxos de Caixa quando ela é elaborada pelo método","options":["direto, apenas.","indireto, apenas.","direto e indireto.","fixo, apenas.","variável, apenas."],"answer":"B","why":"No método indireto de DFC, parte-se do resultado e ajustam-se itens sem movimentação de caixa, como depreciação e provisões reconhecidas no resultado.","others":"No método direto apresentam-se recebimentos e pagamentos brutos, sem esse quadro de conciliação como eixo principal; “fixo” e “variável” não são os métodos de DFC."},{"original":86,"topic":"DEMONSTRAÇÃO DO VALOR ADICIONADO","prompt":"As opções a seguir apresentam exemplos de transações classificadas como “Valor Adicionado recebido em transferência” na elaboração da Demonstração do Valor Adicionado, à exceção de uma. Assinale-a.","options":["Variações cambiais ativas.","Resultado de equivalência patrimonial.","Desconto financeiro obtido.","Receitas relativas à construção de ativos próprios.","Dividendos relativos a investimentos avaliados ao custo."],"answer":"D","why":"Receitas decorrentes da construção de ativos para uso próprio correspondem ao valor produzido pela própria entidade, não a valor adicionado recebido em transferência.","others":"Variação cambial ativa, equivalência patrimonial, descontos financeiros obtidos e certos dividendos de investimentos avaliados ao custo podem integrar valor recebido em transferência segundo a estrutura de DVA cobrada."},{"original":91,"topic":"RESERVAS DE LUCROS","prompt":"Assinale a opção que indica, no patrimônio líquido de uma sociedade empresária, o item que faz parte da reserva de lucro.","options":["O ágio na emissão de ações.","A reserva especial de ágio na incorporação.","A reserva de incentivos fiscais.","A alienação de bônus de subscrição.","A alienação de partes beneficiárias."],"answer":"C","why":"Reserva de incentivos fiscais é uma modalidade de reserva de lucros admitida na Lei das S.A., vinculada à destinação de parcela do lucro relacionada aos incentivos.","others":"Ágio em emissão de ações, bônus de subscrição e partes beneficiárias se relacionam a reservas de capital, não reservas de lucro; a reserva especial de ágio citada não corresponde à modalidade solicitada."},{"original":96,"topic":"DIVIDENDOS","prompt":"Em 05/01/X1, uma entidade declarou dividendos referentes ao período contábil de X0 aos detentores de instrumentos de patrimônio, em um montante superior ao valor obrigatório. A parcela excedente ao montante obrigatório deve ser reconhecida como","options":["passivo circulante.","passivo não circulante.","patrimônio líquido.","redutor do patrimônio líquido.","sem reconhecimento no balanço patrimonial."],"answer":"C","why":"Segundo o gabarito da coletânea, dividendos adicionais aos mínimos obrigatórios declarados após o encerramento do exercício de referência permanecem no patrimônio líquido relativo ao balanço daquele exercício, e não como obrigação existente em 31/12/X0.","others":"Classificá-los automaticamente como passivo circulante ou não circulante em X0 antecipa obrigação ainda inexistente na data-base. Atenção: a declaração efetiva em 05/01/X1 pode gerar obrigação em X1; a resposta depende da data do balanço considerada."}], TAG='moreira_quiz_fgv_2026_v3_'+QUIZ_NUM;
const app=document.querySelector('#app'), footer=document.querySelector('#footer');
const letters=['A','B','C','D','E'];
let state={screen:'cover',index:0,selected:Array(20).fill(null),confirmed:Array(20).fill(false)};
try{let prior=JSON.parse(localStorage.getItem(TAG)||'null');if(prior&&prior.selected?.length===20&&prior.confirmed?.length===20){state={...state,index:Math.max(0,Math.min(19,prior.index||0)),selected:prior.selected,confirmed:prior.confirmed};}}catch(e){}
function save(){try{localStorage.setItem(TAG,JSON.stringify({index:state.index,selected:state.selected,confirmed:state.confirmed}));}catch(e){}}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asText=s=>escapeHTML(s).replace(/\n/g,'<br>');
const result=()=>({n:state.confirmed.filter(Boolean).length,good:state.confirmed.filter((c,i)=>c&&letters[state.selected[i]]===DATA[i].answer).length});
function mast(head){return `<header class="mast"><div class="brand">CURSO DE CONTABILIDADE <strong>PROFESSOR MOREIRA</strong></div><div class="mastline"><span class="pill">QUESTÕES BÁSICAS DA FGV</span><span class="pill">QUIZ ${QUIZ_NUM} DE 5</span></div></header>`;}
function render(){let view='';if(state.screen==='cover'){let score=result();view=mast()+`<section class="whitecard cover"><div class="eyebrow">Treinamento interativo • FGV</div><h1>Questões Básicas da FGV</h1><div class="lede">20 questões de Contabilidade Geral, abrangendo 20 assuntos diferentes. Responda, confirme e veja a correção detalhada imediatamente abaixo.</div><div class="highlights"><div class="hl"><b>20</b><span>QUESTÕES</span></div><div class="hl"><b>20</b><span>ASSUNTOS</span></div><div class="hl"><b>${score.n}</b><span>JÁ RESPONDIDAS</span></div></div><button class="primary big-btn" data-act="start">${score.n?'▶ Continuar de onde parou':'▶ Começar o Quiz '+QUIZ_NUM}</button><p class="small">Sem senha e sem trava. Funciona sem internet depois de salvo. Seu progresso fica neste navegador.</p>${score.n?'<button class="minibtn" data-act="reset">Reiniciar todas as respostas</button>':''}</section>`;footer.hidden=true;}
else if(state.screen==='results'){let s=result(),pct=Math.round(s.good/20*100),miss=s.n-s.good;view=mast()+`<section class="whitecard results"><div class="eyebrow">Relatório do aluno — Quiz ${QUIZ_NUM}</div><h2>Resultado do treinamento</h2><div class="score">${pct}%</div><div class="scoresub">${s.good} acertos em 20 questões • pontuação de 0 a 100%</div><div class="metrics"><div class="metric"><strong>${s.good}</strong><span>ACERTOS</span></div><div class="metric"><strong>${miss}</strong><span>ERROS</span></div><div class="metric"><strong>${20-s.n}</strong><span>NÃO RESPONDIDAS</span></div></div><p>${s.good===20?'Excelente! Você acertou todas as questões.':s.good>=15?'Bom desempenho. Revise especialmente os erros comentados.':'Revise as explicações e refaça as questões com atenção aos conceitos.'}</p><div class="result-actions"><button class="primary" data-act="review">↩ Rever as questões</button><button class="outline" data-act="cover">⌂ Voltar à capa</button><button class="danger" data-act="reset">⟳ Reiniciar Quiz ${QUIZ_NUM}</button></div><h3>Revisão por assunto</h3><div class="review">${DATA.map((q,i)=>{let status=state.confirmed[i]?(letters[state.selected[i]]===q.answer?'ok':'bad'):'skip';return `<button data-act="jump" data-index="${i}"><span><strong>${String(i+1).padStart(2,'0')}.</strong> ${escapeHTML(q.topic)}</span><span class="rmark ${status}">${status==='ok'?'✓':status==='bad'?'✕':'—'}</span></button>`}).join('')}</div></section>`;footer.hidden=true;}
else{let i=state.index,q=DATA[i],done=state.confirmed[i],chosen=state.selected[i],correctIdx=letters.indexOf(q.answer),pass=done&&chosen===correctIdx,s=result();view=mast()+`<section class="whitecard"><div class="questiontop"><span>QUESTÃO ${i+1} DE 20</span><span>${s.n} respondidas</span></div><div class="bar" role="progressbar" aria-valuenow="${s.n}" aria-valuemax="20"><div style="width:${s.n/20*100}%"></div></div><span class="topic">${escapeHTML(q.topic)}</span><h2 class="qtitle">${asText(q.prompt)}</h2><div class="answers" role="radiogroup" aria-label="Selecione uma alternativa">${q.options.map((o,j)=>`<button class="opt ${chosen===j?'selected':''} ${done?(j===correctIdx?'right':(j===chosen?'wrong':'')):''}" data-act="select" data-option="${j}" ${done?'disabled':''} aria-pressed="${chosen===j}"><span class="letter">${letters[j]}</span><span>${asText(o)}</span></button>`).join('')}</div><div class="tools">${!done?`<button class="primary" data-act="confirm" ${chosen==null?'disabled':''}>✓ Confirmar resposta</button>`:`<button class="subtle" data-act="redo">↺ Refazer esta questão</button>`}</div>${done?`<article class="feedback ${pass?'':'fail'}" id="correcao"><div class="fhead"><span class="status-icon">${pass?'✓':'✕'}</span>${pass?'Você acertou! Luz verde.':'Você errou. Luz vermelha.'}</div><div class="fbcontent"><div class="gabarito">GABARITO DA COLETÂNEA: ALTERNATIVA ${q.answer} — ${escapeHTML(q.options[correctIdx])}</div><h3>Por que essa alternativa está correta?</h3><p>${asText(q.why)}</p><h3>Por que as outras alternativas estão incorretas?</h3><p>${asText(q.others)}</p><div class="sourcehint">Correção didática elaborada a partir das questões e do gabarito da coletânea fornecida. Quando há ressalvas, elas aparecem no comentário.</div></div></article>`:''}</section>`;
footer.hidden=false;footer.innerHTML=`<div class="navin"><button class="outline" data-act="prev" ${i===0?'disabled':''}>← Voltar</button><button class="primary" data-act="next">${i===19?'Finalizar ✓':'Avançar →'}</button><button class="subtle" data-act="reset" title="Reiniciar as 20 questões" aria-label="Reiniciar quiz">⟳</button></div>`;}
app.innerHTML=view;}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
function flash(success){let el=document.querySelector('#flash');el.className='flash '+(success?'':'error')+' show';document.querySelector('#flashmsg').textContent=success?'✓ ACERTOU!':'✕ ERROU!';window.clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove('show'),900);}
function reset(){if(confirm('Reiniciar este quiz? Isso apagará as respostas salvas das 20 questões.')){state.index=0;state.selected=Array(20).fill(null);state.confirmed=Array(20).fill(false);state.screen='cover';save();render();scrollTop();}}
function nav(i){state.index=Math.min(19,Math.max(0,i));state.screen='question';save();render();scrollTop();}
document.addEventListener('click',e=>{let btn=e.target.closest('button[data-act]');if(!btn)return;let cmd=btn.dataset.act;if(cmd==='start'){nav(state.index);}
else if(cmd==='select'){if(!state.confirmed[state.index]){state.selected[state.index]=Number(btn.dataset.option);save();render();}}
else if(cmd==='confirm'){let i=state.index,q=DATA[i];if(state.selected[i]==null||state.confirmed[i])return;state.confirmed[i]=true;save();render();flash(letters[state.selected[i]]===q.answer);setTimeout(()=>document.querySelector('#correcao')?.scrollIntoView({block:'start',behavior:'smooth'}),90);}
else if(cmd==='redo'){state.confirmed[state.index]=false;state.selected[state.index]=null;save();render();}
else if(cmd==='prev'){nav(state.index-1);}
else if(cmd==='next'){state.index===19?(state.screen='results',save(),render(),scrollTop()):nav(state.index+1);}
else if(cmd==='reset'){reset();}
else if(cmd==='review'){nav(0);}
else if(cmd==='jump'){nav(Number(btn.dataset.index));}
else if(cmd==='cover'){state.screen='cover';save();render();scrollTop();}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey){if(state.index===19){state.screen='results';render();scrollTop();}else nav(state.index+1);}if(e.key==='ArrowLeft'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey&&state.index>0)nav(state.index-1);});
render();
</script></body></html>
